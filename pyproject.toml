[project]
name = "mini-hermes-memory"
version = "0.1.0"
description = "A small, readable reimplementation of Hermes Agent's memory design: frozen snapshot, session archive, skills, background review and memory-poisoning defence"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "openai==2.24.0",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mini-hermes = "mini_hermes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_hermes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
